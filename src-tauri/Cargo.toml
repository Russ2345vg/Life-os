[package]
name = "lifeos"
version = "1.0.46"
description = "LifeOS Windows desktop application"
authors = ["LifeOS"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
sha2 = "0.10.9"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Data_Xml_Dom", "Foundation", "Globalization", "UI_Notifications",
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_TaskScheduler", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
] }
